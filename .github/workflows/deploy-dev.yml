name: Deploy (dev)

# develop 푸시 시 FE 미니 AWS(S3 + CloudFront)로 자동 배포.
# 검증(lint·typecheck·test·build)은 ci.yml이 담당하고, 여기서는 빌드 산출물 배포만 한다.
on:
  push:
    branches: [develop]
  # develop push 이벤트가 유실돼 자동 배포가 누락된 경우 수동 재배포용
  # (Actions 탭 Run workflow 또는 gh workflow run deploy-dev.yml --ref develop)
  workflow_dispatch:

# 연속 푸시 시 이전 배포는 취소하고 최신 커밋만 반영
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # 1주차 dev 배포 — BE가 없어 MSW mock으로 로그인·전체 흐름을 시연한다. BE 합류 시 이 env 제거.
        # VITE_REAL_AUTH: 배포는 시크릿(true)으로 실 auth 사용. 로컬은 미설정 → 기본 false(mock 로그인).
        run: pnpm build
        env:
          VITE_ENABLE_MOCK: 'true'
          VITE_REAL_AUTH: ${{ secrets.VITE_REAL_AUTH }}
          # BE HTTPS 엔드포인트(API용 CloudFront → ALB). 공개 URL이라 시크릿 불필요.
          # 실 auth(VITE_REAL_AUTH=true) 호출이 이 도메인으로 감(cross-origin → BE CORS 필요).
          VITE_API_BASE_URL: 'https://d3eylh4fl880qc.cloudfront.net'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 해시 파일명 에셋은 장기 캐시(immutable), index.html은 no-cache로 항상 최신 진입점 보장
      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
